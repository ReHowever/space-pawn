function renderWater(){if(currentProfile()){state.lastProfiles=state.lastProfiles||{};state.lastProfiles[state.waterMode]=state.profileId}let isP=state.waterMode==='purifier',profiles=state.profiles.filter(x=>x.type===state.waterMode);$('water').innerHTML=`<div class="actions"><button data-water="purifier" class="${isP?'active':''}">净水器</button><button data-water="collector" class="${!isP?'active':''}">水分收集器</button></div>`+card('设备档案',`<label>选择已保存设备<select id="profile-select"><option value="">临时配置</option>${profiles.map(p=>`<option value="${safe(p.id)}" ${p.id===state.profileId?'selected':''}>${safe(p.name)} · P${p.p}% / Q${p.q}% / E${p.e}%</option>`).join('')}</select></label>`+grid(field('dev-name','设备名称','新设备',{text:true,wide:true}),field('dev-p','性能 P（%）',0),field('dev-q','质量 Q（%）',0),field('dev-e','效率 E（%）',0))+`<div class="actions"><button id="profile-save" class="primary">保存为新设备</button><button id="profile-update" ${currentProfile()?'':'disabled'}>更新当前</button><button id="profile-delete" class="danger" ${currentProfile()?'':'disabled'}>删除</button></div><small id="profile-msg">本机保存；设备名称可自定义。切换档案时自动载入三项数值。</small>`)+card(isP?'净水模拟':'集水模拟',isP?grid(field('pur-volume','初始液量（mL）',6000),field('pur-start','初始纯度（%）',90),field('pur-energy','可用电量（kJ）',100),field('pur-limit','最多模拟晚数',365))+`<div class="actions">${[80,90,96,98,99,99.9].map(x=>`<button data-preset="${x}">${x}%</button>`).join('')}</div>`+out('waterRes'):grid(field('col-count','同时可运行集水器总数',1),field('col-cap','接收容器容量（mL）',6000),field('col-current','容器已有液量（mL）',0),field('col-purity','已有液体纯度（%）',100),field('col-energy','可用电量（kJ）',100),field('col-nights','模拟晚数（同一容器）',1))+out('waterRes'),isP?'性能按当前水质改变每晚去污预算，质量决定停止阈值；净化不改变总体积。':'质量决定随机产水区间；多台设备共享空气，效率仅改变耗电。')+card('已保存设备对比','<div id="compareRes" class="result"></div>','使用当前模拟的初始条件，对比所有同类型设备。')+(isP?card('水质分级',`<div class="tablewrap"><table><thead><tr><th>水质</th><th>最低显示纯度</th></tr></thead><tbody>${[[35,'沟渠水'],[90,'铁锈水'],[96,'幽灵水'],[98,'基础水'],[99,'优质水'],[99.9,'纯水']].map(([x,l])=>`<tr><td>${l}</td><td>${x}%</td></tr>`).join('')}</tbody></table></div><p class="muted">净水器质量达到100%可净化至99.90%，达到200%可净化至100%。</p>`):'');}
function compareWater(){const box=$('compareRes');if(!box)return;const ps=state.profiles.filter(x=>x.type===state.waterMode);if(!ps.length){box.innerHTML='还没有同类型的已保存设备。';return}if(state.waterMode==='purifier'){let t=n('pur-volume',6000),s=n('pur-start',90),en=n('pur-energy',100),limit=n('pur-limit',365);if(!valid(t,s,en,limit)||t<=0||s>100||limit<1||limit>365){box.innerHTML=bad;return}box.innerHTML='<div class="tablewrap"><table><thead><tr><th>设备</th><th>首晚纯度</th><th>最终纯度</th><th>耗电</th></tr></thead><tbody>'+ps.map(x=>{const r=purifier(t,s,x.p,x.q,x.e,Math.floor(limit),en);return `<tr><td>${safe(x.name)}</td><td>${fmt(r.rows[0]?.purity??s,3)}%</td><td>${fmt(r.final,3)}%</td><td>${r.spent} kJ</td></tr>`}).join('')+'</tbody></table></div><small>各设备单独处理同一批起始水，使用相同电量与周期限制。</small>'}else{let count=n('col-count',1),cap=n('col-cap',6000),cur=n('col-current',0);if(!valid(count,cap,cur)||count<1||cur>cap){box.innerHTML=bad;return}box.innerHTML='<div class="tablewrap"><table><thead><tr><th>设备</th><th>产量/晚</th><th>新水纯度</th><th>耗电/晚</th></tr></thead><tbody>'+ps.map(x=>{const r=collector(x.p,x.q,x.e,count,cap-cur);return `<tr><td>${safe(x.name)}</td><td>${fmt(r.actual,2)} mL</td><td>${fmt(r.min,2)}–${fmt(r.max,2)}%</td><td>${r.cost} kJ</td></tr>`}).join('')+'</tbody></table></div><small>对比单台单晚，假设电量充足、相同共享设备数量和容器剩余空间。</small>'}}
function waterCalc(){compareWater();let p=n('dev-p'),q=n('dev-q'),e=n('dev-e');if(![p,q,e].every(Number.isFinite)){result('waterRes',bad);return}if(state.waterMode==='purifier'){let volume=n('pur-volume',6000),start=n('pur-start',90),power=n('pur-energy',100),limit=n('pur-limit',365);if(!valid(volume,start,power,limit)||volume<=0||start>100||limit<1||limit>365||!Number.isInteger(limit)){result('waterRes',bad);return}let r=purifier(volume,start,p,q,e,limit,power);result('waterRes','预计最终水纯度'+big(fmt(r.final,5)+'%')+row('游戏显示等级',wgrade(r.shown??start))+row('机器纯度上限',fmt(r.target,2)+'%')+row('有效净化周期',r.rows.length+' 晚')+row('每晚耗电',r.cost+' kJ')+row('总耗电',r.spent+' kJ')+row('停止原因',r.stop)+(r.rows.length?`<div class="sep tablewrap"><table><thead><tr><th>晚数</th><th>去污 mL</th><th>水纯度</th><th>累计 kJ</th></tr></thead><tbody>${r.rows.map(x=>`<tr><td>${x.day}</td><td>${fmt(x.removed,3)}</td><td>${fmt(x.purity,5)}%</td><td>${x.energy}</td></tr>`).join('')}</tbody></table></div>`:'')+'<small>输入纯度即可预测总体去污；不推断具体污染物组成。按游戏内部微升整数模型估算，不含加速模组及其他同时发生的化学反应。</small>');}else{let count=n('col-count',1),cap=n('col-cap',6000),cur=n('col-current',0),start=n('col-purity',100),power=n('col-energy',100),nights=n('col-nights',1);if(!valid(count,cap,cur,start,power,nights)||count<1||!Number.isInteger(count)||start>100||cur>cap||nights<1||nights>365||!Number.isInteger(nights)){result('waterRes',bad);return}let r=collector(p,q,e,count,cap-cur),vol=cur,lo=cur*start/100,hi=lo,spent=0,rows=[];for(let i=1;i<=nights&&vol<cap;i++){if(spent+r.cost>power)break;let add=Math.min(r.yield,cap-vol);spent+=r.cost;vol+=add;lo+=add*r.min/100;hi+=add*r.max/100;rows.push({i,add,vol,lo:vol?lo/vol*100:0,hi:vol?hi/vol*100:0,spent});}result('waterRes','单台每晚理论产量'+big(fmt(r.yield,3)+' mL')+row('新产水水质',r.grade)+row('新产水纯度范围',fmt(r.min,2)+'%–'+fmt(r.max,2)+'%')+row('本设备每晚耗电',energy(6,e)+' kJ')+row('实际进入容器的总产量',fmt(vol-cur,3)+' mL')+row('容器最终液量',fmt(vol,3)+' mL')+row('混合后理论纯度范围',vol?fmt(lo/vol*100,4)+'%–'+fmt(hi/vol*100,4)+'%':'—')+row('累计耗电',spent+' kJ')+(rows.length?`<div class="sep tablewrap"><table><thead><tr><th>晚数</th><th>产量 mL</th><th>总液量 mL</th><th>累计 kJ</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.i}</td><td>${fmt(x.add,3)}</td><td>${fmt(x.vol,3)}</td><td>${x.spent}</td></tr>`).join('')}</tbody></table></div>`:'')+'<small>产水纯度随机，范围不是固定值；未模拟滤芯与微升分配造成的极小差异。容器装满停止，超出容量的产水不计入收获。</small>');}}
function renderTools(){$('tools').innerHTML=strategyFields()+card('通用滴管计算',grid(select('tool-kind','处理类型','acid',[['acid','蛋白质／酸碱 1:1'],['fat','脂肪／脂合剂 8:1'],['other','直接指定有效成分']]))+doseFields('tool-','目标或待处理量（读数）',10,85.85))+card('蒸发器',grid(field('tevW','水（mL）',0),field('tevA','酒精（mL）',0),field('tevL','脂合剂（mL）',0),field('tevC','每晚处理量（mL）',300))+out('toolEv'))+card('养殖安全液量',grid(field('fish-count','鱼数量',6),select('fish-stage','生长阶段','1000',[[100,'幼年 100 mL/条'],[350,'亚成年 350 mL/条'],[750,'成年 750 mL/条'],[1000,'老年 1000 mL/条']]),field('fish-current','当前液量（mL）',7000),field('fish-margin','安全余量（%）',15))+out('fishRes'),'鱼苗整窝需求与独立幼鱼不同，按实际数量和游戏提示修正。')+card('通用溶液配比',grid(field('generic-target','目标有效成分（mL）',550),field('generic-existing','已有有效成分（mL）',0),field('generic-conc','补充液浓度（%）',70))+out('genericRes'));}
function toolsCalc(){doseCalc('tool-',v('tool-kind','acid')==='fat'?8:1);evCalc('tev','toolEv');let count=n('fish-count',6),stage=n('fish-stage',1000),cur=n('fish-current',7000),margin=n('fish-margin',15);result('fishRes',valid(count,stage,cur,margin)&&Number.isInteger(count)?'建议安全液量'+big(fmt(count*stage*(1+margin/100))+' mL')+row('最低液量',fmt(count*stage)+' mL')+row('建议补充',fmt(Math.max(0,count*stage*(1+margin/100)-cur))+' mL'):bad);let t=n('generic-target',550),x=n('generic-existing',0),c=n('generic-conc',70);result('genericRes',valid(t,x,c)&&c>0&&c<=100?'应补充的溶液'+big(fmt(Math.max(0,t-x)/(c/100),5)+' mL'):bad)}
function calculate(){if(state.tab==='chem')chemicalCalc();else if(state.tab==='water')waterCalc();else toolsCalc();save()}
function render(){if(!['chem','water','tools'].includes(state.tab))state.tab='chem';for(let k of ['chem','water','tools'])$(k).hidden=state.tab!==k;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));if(state.tab==='chem')renderChem();else if(state.tab==='water')renderWater();else renderTools();calculate()}
document.addEventListener('input',e=>{let k=e.target.dataset.k;if(k){state.values[k]=e.target.value;calculate()}});document.addEventListener('change',e=>{let k=e.target.dataset.k;if(k){state.values[k]=e.target.value;calculate()}if(e.target.id==='profile-select'){state.profileId=e.target.value;let pr=currentProfile();if(pr){for(let x of ['p','q','e'])state.values['dev-'+x]=String(pr[x]);state.values['dev-name']=pr.name}render()}});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){state.tab=b.dataset.tab;render()}else if(b.dataset.strategy){state.strategy=b.dataset.strategy;render()}else if(b.dataset.product){state.product=b.dataset.product;render()}else if(b.dataset.water){state.waterMode=b.dataset.water;pickProfile();render()}else if(b.dataset.preset){state.values['pur-start']=b.dataset.preset;render()}else if(b.id==='profile-save'||b.id==='profile-update'){let name=v('dev-name','新设备').trim(),p=n('dev-p'),q=n('dev-q'),en=n('dev-e');if(!name||![p,q,en].every(Number.isFinite)){$('profile-msg').textContent='名称及三个参数不能为空。';return}let pr=b.id==='profile-update'?currentProfile():null;if(pr)Object.assign(pr,{name,p,q,e:en});else{pr={id:'d'+Date.now().toString(36),type:state.waterMode,name,p,q,e:en};state.profiles.push(pr)}state.profileId=pr.id;render();$('profile-msg').textContent='已保存：'+name}else if(b.id==='profile-delete'){let pr=currentProfile();if(pr&&confirm('删除设备档案 '+pr.name+'？')){state.profiles=state.profiles.filter(x=>x.id!==pr.id);state.profileId='';pickProfile();render()}}else if(b.id==='newbatch'){let k=state.product+'-';for(let x of ['mush','existing','existingCaffeine','proteinamount','fatamount','proteinactive','proteinexistingImp','fatactive','fatexistingImp','nomE','nomR','nomL','nomA','nomT','phaM','phaS','phaR','evW','evA','evL','active','metal','chem','other','reviewActive','reviewProtein','reviewAcid','reviewBase','reviewMetal','reviewChem','reviewOther'])state.values[k+x]=['proteinactive','proteinexistingImp','fatactive','fatexistingImp','reviewActive'].includes(x)?'':'0';render()}});
render();if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{$('offline').textContent='离线缓存已准备 · 数据仅保存于当前设备。'}).catch(()=>{$('offline').textContent='离线缓存暂未成功，请联网重新打开。'})}
</script></body></html>
