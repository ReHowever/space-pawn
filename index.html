<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>深空当铺助手</title><style>
:root{color-scheme:dark;--bg:#10151c;--card:#1a222d;--line:#34414f;--muted:#a5b4c4;--accent:#8ce0c1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef4f9;font:16px -apple-system,BlinkMacSystemFont,sans-serif;padding:env(safe-area-inset-top) 16px calc(32px + env(safe-area-inset-bottom));}main{max-width:680px;margin:auto}header{padding:24px 0 16px}h1{font-size:27px;margin:0 0 8px}h2{font-size:19px;margin:0 0 14px}p{line-height:1.5}small,.muted{color:var(--muted);font-size:13px;line-height:1.5}nav{display:flex;gap:7px;overflow:auto;padding:6px 0 15px;position:sticky;top:env(safe-area-inset-top);background:var(--bg);z-index:1}button,select,input{font:inherit;color:inherit;border:1px solid var(--line);border-radius:10px;background:#111923;padding:11px;min-height:44px}button{cursor:pointer;white-space:nowrap}button.active{background:var(--accent);color:#10231e;border-color:var(--accent);font-weight:700}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:13px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:13px}input,select{width:100%;min-width:0;color:#fff}select.full{margin-bottom:12px}.result{margin-top:15px;padding:14px;background:#111923;border-radius:12px;line-height:1.65;overflow-wrap:anywhere}.big{font-size:28px;font-weight:750;color:var(--accent);font-variant-numeric:tabular-nums}.line{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}section[hidden]{display:none}.warning{color:#ffc77f}footer{margin:20px 0} @media(max-width:350px){.grid{grid-template-columns:1fr}}
</style></head><body><main><header><h1>深空当铺助手</h1><div class="muted">游戏数值工具 · 离线计算 · 本机保存</div></header><nav id="nav"></nav><div id="panels"></div><footer><button id="reset">清空本批数据（保留设备及试剂参数）</button><p class="muted" id="offline">首次联网加载后可缓存离线使用。数值为游戏模型估算，以扫描仪实测为准。</p></footer></main><script>
'use strict';const tabs=[['mix','配比'],['dose','精准加料'],['purity','纯度'],['evap','蒸发'],['fish','养殖'],['water','水分收集']];
const config={mix:[['target','目标有效成分（mL）',550],['existing','已有有效成分（mL）',301.51],['mixC','补充液浓度（%）',70]],dose:[['need','目标有效成分（mL）',10],['doseC','试剂浓度（%）',85.85],['step','单次滴管容量（mL）',1],['tol','允许误差（μL）',2]],purity:[['product','目标成分（mL）',55],['metal','重金属（μL）',42],['chemical','化学污染物（μL）',212],['other','其他残留杂质（μL）',0]],evap:[['water','水（mL）',127.26],['alcohol','其他可蒸发成分（mL）',550.99],['capacity','每晚处理量（mL）',300]],fish:[['count','鱼数量',6],['perFish','单条需求（mL）',1000],['current','现有液量（mL）',7000],['margin','安全余量（%）',15]],water:[['base','基础每晚产量（mL）',850],['performance','性能加成（%）',0],['quality','质量加成（%）',150]]};
let state={};try{state=JSON.parse(localStorage.getItem('pawn-helper-v1')||'{}')||{}}catch(e){};const ids=Object.values(config).flat();for(const [id,label,def] of ids)if(!(id in state))state[id]=String(def);const $=id=>document.getElementById(id),fmt=(n,d=4)=>Number.isFinite(n)?Number(n.toFixed(d)).toLocaleString('zh-CN',{maximumFractionDigits:d}):'—';let active=state.active||'mix';if(!tabs.some(t=>t[0]===active))active='mix';
function save(){try{localStorage.setItem('pawn-helper-v1',JSON.stringify(state))}catch(e){}}function read(id){return state[id].trim()===''?NaN:Number(state[id])}function valid(...v){return v.every(n=>Number.isFinite(n)&&n>=0)}function out(id,html){$('result-'+id).innerHTML=html}function big(v){return '<div class="big">'+v+'</div>'}function err(id){out(id,'<span class="warning">请检查输入数据。</span>')}
function solve(target,c,d,t){let stock=target/(c/100),u=stock/d,base=Math.floor(u),best=null;function candidate(k,a,b,z){let used=d*(k+(a+b?z*a/(a+b):0)),actual=used*c/100;return {k,a,b,z,used,actual,error:(actual-target)*1000,cost:a+b+z}}function compare(p,q){return !q||Math.abs(p.error)<Math.abs(q.error)-1e-9||Math.abs(Math.abs(p.error)-Math.abs(q.error))<1e-9&&p.cost<q.cost}best=candidate(Math.round(u),0,0,0);if(Math.abs(best.error)<=t)return best;let selected=null;for(let total=2;total<=100;total++){for(let z=1;z<=Math.min(total,8);z++){let fractional=u-base;let a0=Math.round(fractional*total/z);for(let a=Math.max(1,a0-1);a<=Math.min(total-1,a0+1);a++){let p=candidate(base,a,total-a,z);if(compare(p,best))best=p;if(Math.abs(p.error)<=t+1e-9&&(!selected||p.cost<selected.cost||p.cost===selected.cost&&compare(p,selected)))selected=p;}}if(selected&&total>=selected.cost)break;}return selected||best}
function calculate(){let t=read('target'),e=read('existing'),c=read('mixC');if(valid(t,e,c)&&c>0&&c<=100){let x=Math.max(0,t-e)/(c/100);out('mix','需补充溶液'+big(fmt(x)+' mL')+'按整毫升向上取整：<b>'+fmt(Math.ceil(x-1e-10))+' mL</b><br>有效成分缺口：'+fmt(Math.max(0,t-e))+' mL')}else err('mix');let n=read('need'),s=read('doseC'),d=read('step'),tol=read('tol');if(valid(n,s,d,tol)&&s>0&&s<=100&&d>0&&n/(s/100)/d<1e8){let p=solve(n,s,d,tol);let html='理论原液用量'+big(fmt(n/(s/100),6)+' mL')+'<div class="line"><b>① 直接加入 '+fmt(p.k*d)+' mL 原液</b></div>';if(p.a){html+='<div class="line"><b>② 空瓶：'+fmt(p.a*d)+' mL 原液 + '+fmt(p.b*d)+' mL 纯水</b><br>辅助液浓度：'+fmt(s*p.a/(p.a+p.b),5)+'%</div><div class="line"><b>③ 混匀后只取 '+fmt(p.z*d)+' mL 辅助液加入目标瓶</b><br>剩余辅助液：'+fmt((p.a+p.b-p.z)*d)+' mL</div>'}html+='<div class="line">实际有效成分：'+fmt(p.actual,6)+' mL<br>理论误差：<b class="'+(Math.abs(p.error)>tol?'warning':'')+'">'+(p.error>0?'+':'')+fmt(p.error,3)+' μL</b><br><small>整数次滴管搜索；误差不含扫描显示取整及游戏内部取整。</small></div>';if(Math.abs(p.error)>tol)html+='<p class="warning">在当前搜索范围内未达到目标精度。</p>';out('dose',html)}else err('dose');let pr=read('product'),m=read('metal'),ch=read('chemical'),o=read('other'),dry=pr+(m+ch+o)/1000;if(valid(pr,m,ch,o)&&dry>0)out('purity','理论纯度'+big(fmt(100*pr/dry,5)+'%')+'残留杂质：'+fmt(m+ch+o)+' μL<br>最终体积：'+fmt(dry,6)+' mL<br><small>假设其他杂质已去除、加工无损失。</small>');else err('purity');let w=read('water'),a=read('alcohol'),cap=read('capacity');if(valid(w,a,cap)&&cap>0)out('evap','预计耗时'+big(fmt(Math.ceil((w+a)/cap))+' 晚')+'待处理：'+fmt(w+a)+' mL<br>最后一晚后预计剩余 0 mL');else err('evap');let count=read('count'),per=read('perFish'),cur=read('current'),margin=read('margin');if(valid(count,per,cur,margin)&&Number.isInteger(count))out('fish','建议液量（含余量）'+big(fmt(count*per*(1+margin/100))+' mL')+'最低需求：'+fmt(count*per)+' mL<br>建议补充：'+fmt(Math.max(0,count*per*(1+margin/100)-cur))+' mL');else err('fish');let b=read('base'),pf=read('performance'),q=read('quality');if(valid(b,q)&&Number.isFinite(pf)&&pf>=-100)out('water','理论单台每晚产量'+big(fmt(b*(1+pf/100))+' mL')+'质量参考：'+(q>=150?'纯水':q>=100?'优质水':q>=50?'基础水':'幽灵水')+'<br><small>沿用此前游戏估算；多台设备共享水分等机制未计入。</small>');else err('water');save()}
for(const [id,title] of tabs){let btn=document.createElement('button');btn.textContent=title;btn.id='tab-'+id;btn.onclick=()=>show(id);$('nav').append(btn);let section=document.createElement('section');section.id='panel-'+id;section.className='card';section.innerHTML='<h2>'+title+'</h2><div class="grid"></div><div class="result" id="result-'+id+'"></div>';let grid=section.querySelector('.grid');for(const [key,label] of config[id]){let l=document.createElement('label');l.textContent=label;let input=document.createElement('input');input.id=key;input.type='number';input.inputMode='decimal';input.step='any';input.value=state[key];input.oninput=()=>{state[key]=input.value;calculate()};l.append(input);grid.append(l)}if(id==='mix'){let box=document.createElement('div');box.className='actions';for(const c of [70,100]){let b=document.createElement('button');b.textContent=c+'%';b.onclick=()=>{state.mixC=String(c);$('mixC').value=c;calculate()};box.append(b)}section.insertBefore(box,section.lastChild)}if(id==='fish'){let box=document.createElement('div');box.className='actions';for(const [label,v] of [['幼年',100],['亚成年',350],['成年',750],['老年',1000]]){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{state.perFish=String(v);$('perFish').value=v;calculate()};box.append(b)}section.insertBefore(box,section.lastChild)}$('panels').append(section)}
function show(id){active=id;state.active=id;for(const [k] of tabs){$('panel-'+k).hidden=k!==id;$('tab-'+k).classList.toggle('active',k===id)}save()}$('reset').onclick=()=>{for(const key of ['target','existing','need','product','metal','chemical','other','water','alcohol','current']){state[key]='0';$(key).value='0'}calculate()};show(active);calculate();if('serviceWorker'in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('./sw.js').then(()=>navigator.serviceWorker.ready).then(()=>{$('offline').textContent='离线缓存已准备。参数保存在当前浏览器或主屏幕应用内。'}).catch(()=>{$('offline').textContent='离线缓存尚未成功；请保持联网使用并重新打开。'})}
</script></body></html>
